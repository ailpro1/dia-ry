<!doctype html>
<html lang="en" data-theme="peach" data-mode="light">
<head>
<meta charset="utf-8">
<title>dia-ry</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="A calm, private photo diary that lives on your phone.">
<meta name="theme-color" content="#fbe8d3">
<meta name="color-scheme" content="light dark">

<!-- iOS home-screen app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="dia-ry">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" href="icons/favicon.png" sizes="64x64">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<svg class="sr-only" aria-hidden="true">
  <defs>
    <g id="i-back"><path d="M15 5l-7 7 7 7"/></g>
    <g id="i-settings"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 004.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></g>
    <g id="i-edit"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></g>
    <g id="i-camera"><path d="M3 8a2 2 0 012-2h2l1.2-2h7.6L17 6h2a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></g>
    <g id="i-bold"><path d="M7 5h6a3.5 3.5 0 010 7H7z"/><path d="M7 12h7a3.5 3.5 0 010 7H7z"/></g>
    <g id="i-italic"><path d="M15 5h-5M14 19H9M14 5l-4 14"/></g>
    <g id="i-underline"><path d="M7 4v6a5 5 0 0010 0V4"/><path d="M5 20h14"/></g>
    <g id="i-strike"><path d="M5 12h14"/><path d="M8 8a3.5 3.5 0 013.5-3h1A3.5 3.5 0 0116 8"/><path d="M8 16a3.5 3.5 0 003.5 3h1a3.5 3.5 0 003.5-3"/></g>
    <g id="i-mark"><path d="M4 20h16"/><path d="M6 16l6-11 6 11"/><path d="M8.5 12h7"/></g>
    <g id="i-list"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></g>
    <g id="i-quote"><path d="M7 7h4v4a4 4 0 01-4 4z"/><path d="M14 7h4v4a4 4 0 01-4 4z"/></g>
    <g id="i-trash"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/><path d="M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12"/></g>
    <g id="i-pin"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></g>
    <g id="i-close"><path d="M6 6l12 12M18 6L6 18"/></g>
    <g id="i-plus"><path d="M12 5v14M5 12h14"/></g>
    <g id="i-newnote"><path d="M5 4h9l5 5v11a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1z"/><path d="M14 4v5h5"/><path d="M9 14h6M12 11v6"/></g>
    <g id="i-clock"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
  </defs>
</svg>

<div id="app">

  <!-- ============ home ============ -->
  <section class="screen is-active" id="screen-home">
    <header class="topbar">
      <div class="spacer"></div>
      <button class="iconbtn" id="btn-search" aria-label="Search">
        <svg><use href="#i-search"/></svg>
      </button>
      <button class="iconbtn" id="btn-settings" aria-label="Settings">
        <svg><use href="#i-settings"/></svg>
      </button>
    </header>

    <p class="hello" id="hello"></p>
    <h1 class="home-title">dia&#8209;ry</h1>

    <div class="searchbar" id="searchbar" hidden>
      <input type="search" id="search-input" placeholder="search your diary"
             autocomplete="off" autocorrect="off" spellcheck="false">
    </div>

    <div class="page" id="home-list"></div>

    <div class="dock">
      <div class="dock-row">
        <button class="btn-pill" id="btn-write">+ write</button>
        <button class="btn-square" id="btn-new" aria-label="Start a new note">
          <svg><use href="#i-newnote"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ============ note ============ -->
  <section class="screen" id="screen-note">
    <header class="topbar">
      <button class="iconbtn" id="note-back" aria-label="Back">
        <svg><use href="#i-back"/></svg>
      </button>
      <div class="spacer"></div>
      <button class="iconbtn" id="note-pin" aria-label="Pin note">
        <svg><use href="#i-pin"/></svg>
      </button>
      <button class="iconbtn" id="note-edit" aria-label="Edit note details">
        <svg><use href="#i-edit"/></svg>
      </button>
    </header>

    <div class="note-head">
      <p class="sub" id="note-sub"></p>
      <h1 id="note-title"></h1>
    </div>

    <div class="page" id="note-entries"></div>

    <div class="dock">
      <button class="btn-pill" id="btn-add-entry">+ add to this note</button>
    </div>
  </section>

</div>

<!-- ============ composer ============ -->
<div class="sheet full" id="sheet-composer" role="dialog" aria-modal="true" aria-label="Write">
  <div class="scrim" data-close></div>
  <div class="panel">
    <div class="sheet-head">
      <button class="txtbtn" data-close>cancel</button>
      <h2 id="composer-title">add</h2>
      <button class="txtbtn" id="composer-save">save</button>
    </div>
    <div class="sheet-body">
      <div class="composer-time">
        <svg class="sr-only"></svg>
        <span>time</span>
        <input type="time" id="composer-at">
      </div>
      <div class="editor" id="composer-editor" contenteditable="true"
           data-placeholder="what happened…" spellcheck="true"></div>
      <div class="tray" id="composer-tray"></div>
      <div class="progress" id="composer-progress" hidden><i></i></div>
      <div class="toolbar" id="composer-toolbar">
        <button data-photo aria-label="Add photos"><svg><use href="#i-camera"/></svg></button>
        <span class="sep"></span>
        <button data-cmd="bold" aria-label="Bold"><svg><use href="#i-bold"/></svg></button>
        <button data-cmd="italic" aria-label="Italic"><svg><use href="#i-italic"/></svg></button>
        <button data-cmd="underline" aria-label="Underline"><svg><use href="#i-underline"/></svg></button>
        <button data-cmd="strikeThrough" aria-label="Strikethrough"><svg><use href="#i-strike"/></svg></button>
        <button data-cmd="hiliteColor" aria-label="Highlight"><svg><use href="#i-mark"/></svg></button>
        <span class="sep"></span>
        <button data-cmd="insertUnorderedList" aria-label="Bullet list"><svg><use href="#i-list"/></svg></button>
        <button data-cmd="formatBlock" data-arg="blockquote" aria-label="Quote"><svg><use href="#i-quote"/></svg></button>
      </div>
    </div>
  </div>
  <input type="file" id="file-input" accept="image/*" multiple class="sr-only">
</div>

<!-- ============ note details ============ -->
<div class="sheet" id="sheet-note" role="dialog" aria-modal="true" aria-label="Note details">
  <div class="scrim" data-close></div>
  <div class="panel">
    <div class="sheet-head">
      <button class="txtbtn" data-close>cancel</button>
      <h2 id="noteform-title">new note</h2>
      <button class="txtbtn" id="noteform-save">save</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label for="nf-title">title</label>
        <input type="text" id="nf-title" placeholder="cake for breakfast"
               autocapitalize="none" enterkeyhint="done">
      </div>
      <div class="field">
        <label for="nf-date">date</label>
        <input type="date" id="nf-date">
      </div>
      <div class="field">
        <label for="nf-place">place <span style="text-transform:none">(optional)</span></label>
        <input type="text" id="nf-place" placeholder="fanling" autocapitalize="none">
      </div>
      <div class="rows" id="nf-danger" hidden>
        <button class="row danger" id="nf-delete"><span class="lab">delete this note</span></button>
      </div>
    </div>
  </div>
</div>

<!-- ============ settings ============ -->
<div class="sheet full" id="sheet-settings" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="scrim" data-close></div>
  <div class="panel">
    <div class="sheet-head">
      <button class="txtbtn" data-close>done</button>
      <h2>settings</h2>
      <span style="width:64px"></span>
    </div>
    <div class="sheet-body" id="settings-body"></div>
  </div>
</div>

<!-- ============ lightbox ============ -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo">
  <div class="count" id="lightbox-count"></div>
  <button class="close" id="lightbox-close" aria-label="Close">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round"><use href="#i-close"/></svg>
  </button>
  <div class="frame" id="lightbox-frame"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
